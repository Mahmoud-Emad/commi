name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-upload:
    name: Build and Upload
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # Don't cancel other jobs if one fails
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: commi
            asset_name: commi-x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: commi.exe
            asset_name: commi-x86_64-pc-windows-msvc.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: commi
            asset_name: commi-x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: commi
            asset_name: commi-aarch64-apple-darwin

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install system dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libssl-dev

    - name: Build release
      run: cargo build --release --target ${{ matrix.target }}

    - name: Verify binary was built (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        if [ ! -f "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" ]; then
          echo "Error: Binary not found at target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          exit 1
        fi
        echo "Binary built successfully: $(ls -la target/${{ matrix.target }}/release/${{ matrix.artifact_name }})"

    - name: Verify binary was built (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        if (!(Test-Path "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}")) {
          Write-Host "Error: Binary not found at target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          exit 1
        }
        Write-Host "Binary built successfully: $(Get-ChildItem target/${{ matrix.target }}/release/${{ matrix.artifact_name }})"

    - name: Strip binary (Linux and macOS)
      if: matrix.os != 'windows-latest'
      run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

    - name: Rename binary (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        mkdir -p release-assets
        cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} release-assets/${{ matrix.asset_name }}
        echo "Asset prepared: $(ls -la release-assets/${{ matrix.asset_name }})"

    - name: Rename binary (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        New-Item -ItemType Directory -Force -Path release-assets
        Copy-Item target/${{ matrix.target }}/release/${{ matrix.artifact_name }} release-assets/${{ matrix.asset_name }}
        Write-Host "Asset prepared: $(Get-ChildItem release-assets/${{ matrix.asset_name }})"

    - name: Extract changelog for current version (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        # Extract the current version from the tag
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_ENV

        # Extract changelog section for current version
        # Match patterns like "## [4.0.0]" or "## [v4.0.0]"
        awk "/^## \[$VERSION\]/ {flag=1; next} /^## \[[0-9]/ {flag=0} flag" CHANGELOG.md > current_changelog.md

        # If no version-specific changelog found, create a simple one
        if [ ! -s current_changelog.md ]; then
          echo "## Changes in v$VERSION" > current_changelog.md
          echo "" >> current_changelog.md
          echo "See [CHANGELOG.md](CHANGELOG.md) for full details." >> current_changelog.md
        fi

    - name: Extract changelog for current version (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        # Extract the current version from the tag
        $VERSION = $env:GITHUB_REF -replace 'refs/tags/v', ''
        echo "VERSION=$VERSION" >> $env:GITHUB_ENV

        # Extract changelog section for current version using PowerShell
        $content = Get-Content CHANGELOG.md
        $inSection = $false
        $changelog = @()

        foreach ($line in $content) {
          if ($line -match "^## \[$VERSION\]") {
            $inSection = $true
            continue
          }
          if ($inSection -and $line -match "^## \[[0-9]") {
            break
          }
          if ($inSection) {
            $changelog += $line
          }
        }

        # If no version-specific changelog found, create a simple one
        if ($changelog.Count -eq 0) {
          $changelog = @(
            "## Changes in v$VERSION",
            "",
            "See [CHANGELOG.md](CHANGELOG.md) for full details."
          )
        }

        $changelog | Out-File -FilePath current_changelog.md -Encoding utf8

    - name: Debug files before upload (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        echo "Files to upload:"
        ls -la release-assets/
        ls -la CHANGELOG.md current_changelog.md
        echo "Asset name: ${{ matrix.asset_name }}"
        echo "Target: ${{ matrix.target }}"
        echo "OS: ${{ matrix.os }}"

    - name: Debug files before upload (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        Write-Host "Files to upload:"
        Get-ChildItem release-assets/
        Get-ChildItem CHANGELOG.md, current_changelog.md
        Write-Host "Asset name: ${{ matrix.asset_name }}"
        Write-Host "Target: ${{ matrix.target }}"
        Write-Host "OS: ${{ matrix.os }}"

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: |
          release-assets/${{ matrix.asset_name }}
          CHANGELOG.md
        body_path: current_changelog.md
        draft: false
        prerelease: false
        fail_on_unmatched_files: true

